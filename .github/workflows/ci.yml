name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ims
          POSTGRES_PASSWORD: ims
          POSTGRES_DB: ims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ims -d ims_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        run: pytest
        env:
          IMS_TEST_DATABASE_URL: postgresql+psycopg://ims:ims@localhost:5432/ims_test
      - name: Migrations apply cleanly and match the models
        env:
          IMS_DATABASE_URL: postgresql+psycopg://ims:ims@localhost:5432/ims_test
        run: |
          alembic upgrade head
          alembic check
